name: Build and Release PassVaultX

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'


      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build Wails App
        run: wails build -platform windows/amd64 -ldflags "-H windowsgui -s -w"

      - name: Organize Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          $exe = Get-ChildItem "build/bin/*.exe" | Select-Object -First 1
          if ($exe) {
            Copy-Item $exe.FullName -Destination "dist/PassVaultX.exe"
          } else {
            Write-Error "EXE를 찾을 수 없습니다."; exit 1
          }

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PassVaultX.exe
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}