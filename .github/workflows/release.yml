name: Build and Release PassVaultX

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install NSIS
        run: choco install nsis -y

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      # -nsis 옵션 하나로 EXE + Installer 동시 생성
      - name: Build Wails App
        run: wails build -platform windows/amd64 -nsis -ldflags "-H windowsgui -s -w"

      - name: Organize Artifacts
        shell: pwsh
        run: |
          if (Test-Path dist) { Remove-Item -Recurse -Force dist }
          New-Item -ItemType Directory -Force -Path dist

          # 전체 경로에서 installer 파일 검색
          Write-Host "--- 전체 프로젝트에서 .exe 파일 검색 ---"
          Get-ChildItem -Recurse -Filter "*.exe" | Select-Object FullName, Length
          Write-Host "----------------------------------------"

          Write-Host "--- build/bin/ 파일 목록 ---"
          Get-ChildItem "build/bin/" | Select-Object Name, Length
          Write-Host "---------------------------"

          # 인스톨러 복사
          $installer = Get-ChildItem "build/bin/*.exe" | Where-Object { $_.Name -match "installer" -or $_.Name -match "setup" } | Select-Object -First 1
          if ($installer) {
            Copy-Item $installer.FullName -Destination "dist/PassVaultX_Installer.exe"
            Write-Host "Installer 복사 완료: $($installer.Name)"
          } else {
            Write-Error "Installer를 찾을 수 없습니다. 위 파일 목록을 확인하세요."
            exit 1
          }

          # 일반 EXE 복사
          $exe = Get-ChildItem "build/bin/*.exe" | Where-Object { $_.Name -notmatch "installer" -and $_.Name -notmatch "setup" } | Select-Object -First 1
          if ($exe) {
            Copy-Item $exe.FullName -Destination "dist/PassVaultX.exe"
            Write-Host "EXE 복사 완료: $($exe.Name)"
          } else {
            Write-Error "EXE를 찾을 수 없습니다."
            exit 1
          }

          Write-Host "--- dist/ 최종 파일 목록 ---"
          Get-ChildItem "dist/" | Select-Object Name, Length

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PassVaultX.exe
            dist/PassVaultX_Installer.exe
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}