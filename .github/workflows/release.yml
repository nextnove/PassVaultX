name: Build and Release PassVaultX

on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      # 빌드 과정을 하나로 통합 (Wails는 한 번에 nsis까지 가능)
      - name: Build Wails App (EXE & NSIS)
        run: wails build -platform windows/amd64 -nsis -ldflags "-H windowsgui -s -w"

      # 2. 파일 정리 및 이름 변경 (경로 재확인)
      - name: Organize Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          # 일반 EXE 복사 (기본 경로는 build/bin/프로젝트명.exe 입니다)
          Copy-Item "build/bin/*.exe" -Destination "dist/PassVaultX.exe" -Exclude "*-installer.exe"
          # 설치형 EXE 복사 (패턴 매칭 강화)
          Get-ChildItem "build/bin/*installer.exe" | Copy-Item -Destination "dist/PassVaultX_Installer.exe"

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PassVaultX.exe
            dist/PassVaultX_Installer.exe
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}