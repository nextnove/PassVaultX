name: Build and Release PassVaultX

on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      # 빌드 과정을 하나로 통합 (Wails는 한 번에 nsis까지 가능)
      - name: Build Wails App (EXE & NSIS)
        run: wails build -platform windows/amd64 -nsis -ldflags "-H windowsgui -s -w"

      - name: Organize Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist

          # installer 먼저 찾아서 복사
          $installer = Get-ChildItem "build/bin/" -Filter "*-installer.exe" | Select-Object -First 1
          if ($installer) {
            Copy-Item $installer.FullName -Destination "dist/PassVaultX_Installer.exe"
            Write-Host "Installer found: $($installer.Name)"
          } else {
            Write-Error "Installer not found!"
            exit 1
          }

          # installer 제외한 나머지 exe 복사
          $exe = Get-ChildItem "build/bin/" -Filter "*.exe" | Where-Object { $_.Name -notlike "*-installer.exe" } | Select-Object -First 1
          if ($exe) {
            Copy-Item $exe.FullName -Destination "dist/PassVaultX.exe"
            Write-Host "EXE found: $($exe.Name)"
          } else {
            Write-Error "EXE not found!"
            exit 1
          }

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PassVaultX.exe
            dist/PassVaultX_Installer.exe
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}  # ← refs/tags/v1.0.0 → v1.0.0
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}