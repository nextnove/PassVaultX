name: Build and Release PassVaultX

on:
  push:
    tags:
      - 'v*' # v1.0.0, v1.1.0 등 'v'로 시작하는 태그가 푸시될 때만 실행

jobs:
  build:
    strategy:
      matrix:
        platform: [windows-latest] # 현재 윈도우 빌드만 집중
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25' # 본인의 Go 버전에 맞춰 수정 가능

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # 프론트엔드 빌드용

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      # 1. 일반 실행 파일(Portable EXE) 빌드
      - name: Build Wails App (Standard EXE)
        run: wails build -platform windows/amd64 -ldflags "-H windowsgui -s -w"

      # 2. 설치형 파일(NSIS Installer) 빌드
      # 주의: 윈도우 러너에는 NSIS가 기본 설치되어 있습니다.
      - name: Build Wails App (NSIS Installer)
        run: wails build -platform windows/amd64 -nsis -ldflags "-H windowsgui -s -w"

      # 3. 파일 정리 및 이름 변경 (업데이터가 찾기 쉬운 고정 명칭으로)
      - name: Organize Artifacts
        shell: pwsh
        run: |
          mkdir dist
          # 일반 EXE 복사
          copy build/bin/PassVaultX.exe dist/PassVaultX.exe
          # 설치형 EXE 찾아서 복사 (사용자님의 실제 파일명 패턴인 -installer.exe 적용)
          Get-ChildItem build/bin/*-installer.exe | Copy-Item -Destination dist/PassVaultX_Installer.exe

      # 4. GitHub Release 생성 및 두 파일 모두 업로드
      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/PassVaultX.exe
            dist/PassVaultX_Installer.exe
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}